# Réglages Huntited à AJOUTER à la fin du homeserver.yaml généré par Synapse
# (voir docs/matrix.md, étape 2). Objectif : un serveur fermé, sans
# fédération, sans inscription publique, qui en garde le moins possible.

public_baseurl: "https://matrix.huntited.org/"

# Personne ne s'inscrit seul : les comptes temporaires sont créés par le
# backend Huntited (API d'administration).
enable_registration: false
enable_3pid_lookup: false

# Aucune fédération : les salons restent sur ce serveur.
federation_domain_whitelist: []
allow_public_rooms_over_federation: false
allow_public_rooms_without_auth: false

# Profils et présence : rien de visible au-delà des salons partagés.
require_auth_for_profile_requests: true
limit_profile_requests_to_users_who_share_rooms: true
include_profile_data_on_invite: false
presence:
  enabled: false

# Chiffrement de bout en bout par défaut, pas d'aperçu de liens (qui ferait
# télécharger des pages par le serveur).
encryption_enabled_by_default_for_room_type: all
url_preview_enabled: false

# Effacement : purge des salons supprimés et des comptes désactivés.
redaction_retention_period: 1d
user_ips_max_age: 1d

# Pas de statistiques envoyées à matrix.org.
report_stats: false
